# Server Configuration
server.port=8080
server.servlet.context-path=/lankajobshub

# Database Configuration (SQLite) - Temporarily disabled
# spring.datasource.url=jdbc:sqlite:lankajobshub.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=com.lankajobshub.config.SQLiteDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.web.resources.static-locations=classpath:/static/

# File Upload Configuration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# File Storage Configuration (Local Storage)
app.file.upload-dir=./uploads/
app.file.max-size=2097152

# JWT Configuration
app.jwt.secret=lankajobshub-secret-key-2025
app.jwt.expiration=86400000

# Logging Configuration
logging.level.com.lankajobshub=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 